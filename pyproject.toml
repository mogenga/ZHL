[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zhl"
version = "0.0.0"
description = "质慧链光伏检验数字化平台"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "sqlalchemy[asyncio]",
    "alembic",
    "pydantic",
    "httpx",
    "psycopg[binary]",
    "langgraph-checkpoint-postgres",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "aiosqlite",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 90
