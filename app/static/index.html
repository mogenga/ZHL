<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作台 · 质慧链</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%E8%B4%A8%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="page">
    <h1>工作台 · 批次</h1>
    <p class="subtitle">创建批次、从列表进入、按 ID 进入。流程：创建 → 数据入场 → 判定 → 异常处置/复检 → 放行 → 报告。</p>

    <!-- 批次列表（工作台主数据源，GET /api/batches） -->
    <div class="card">
      <h3>批次列表 <button class="btn ghost" id="refreshList" type="button" style="float:right;margin:0">刷新</button></h3>
      <div id="batchList"></div>
    </div>

    <!-- 创建新批次（规则版本改下拉，可发现化） -->
    <div class="card">
      <h3>创建新批次</h3>
      <div class="form-grid">
        <div><label for="fBatchNo">批次编号 batchNo</label><input type="text" id="fBatchNo" placeholder="B-2026-06"></div>
        <div><label for="fProject">项目 ID projectId</label><input type="text" id="fProject" placeholder="P-DEFAULT"></div>
        <div><label for="fModel">型号 model</label><input type="text" id="fModel" placeholder="JH-550W"></div>
        <div class="field-wide">
          <label for="fRule">规则版本（下拉，来自 <span class="mono">GET /api/quality-rule-versions</span>）</label>
          <select id="fRule"><option value="">（加载中…）</option></select>
        </div>
        <div><label for="fQty">计划数量</label><input type="number" id="fQty" min="1" value="10"></div>
      </div>
      <div id="ruleHint"></div>
      <div style="margin-top:12px">
        <button class="btn" id="createBatch">创建批次</button>
      </div>
      <div id="createResult"></div>
    </div>

    <!-- 按 ID 进入 -->
    <div class="card">
      <h3>按批次 ID 进入</h3>
      <div class="form-grid">
        <div>
          <label for="batchId">批次 ID（UUID）</label>
          <input type="text" id="batchId" placeholder="粘贴批次 UUID，或从上方列表点击「进入」">
        </div>
      </div>
      <div style="margin-top:12px">
        <button class="btn" id="goBatch">进入批次详情</button>
        <button class="btn ghost" id="goTraces">查看该批次轨迹</button>
      </div>
    </div>

    <div class="card">
      <h3>快速跳转</h3>
      <div class="item-list">
        <div class="item-row"><span>全局异常列表</span><a class="btn ghost" href="incidents.html">打开</a></div>
        <div class="item-row"><span>状态机参考（批次/异常转移表，静态文档）</span><a class="btn ghost" href="state.html">打开</a></div>
        <div class="item-row"><span>数据入场（需先有批次 ID）</span><a class="btn ghost" href="intake.html">打开</a></div>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    renderTopbar("index.html");

    /* ---- 规则版本下拉：GET /api/quality-rule-versions ---- */
    async function loadRuleVersions() {
      const sel = document.getElementById("fRule");
      const hint = document.getElementById("ruleHint");
      sel.innerHTML = '<option value="">（加载中…）</option>';
      const r = await ZHL.request("GET", "/api/quality-rule-versions", undefined, null);
      if (!r.ok) {
        sel.innerHTML = '<option value="">（加载失败）</option>';
        hint.innerHTML = `<div class="note err">${escapeHtml("规则版本列表加载失败（HTTP " + (r.res ? r.res.status : "网络错误") + "），无法选择。可手动粘贴 UUID 到「按 ID 进入」区，或先运行 scripts/seed-demo.ps1。")}</div>`;
        return;
      }
      const payload = r.data || {};
      const items = payload.items || [];
      const available = payload.available !== false;
      if (!available) {
        sel.innerHTML = '<option value="">（无可用规则版本）</option>';
        hint.innerHTML = `<div class="note warn">数据库表不可用（<span class="mono">table_missing</span>）。请先执行 <span class="mono">scripts/seed-demo.ps1</span> 灌入演示种子后再创建批次。</div>`;
        return;
      }
      if (items.length === 0) {
        sel.innerHTML = '<option value="">（暂无规则版本）</option>';
        hint.innerHTML = `<div class="note warn">暂无任何规则版本。请先执行 <span class="mono">scripts/seed-demo.ps1</span> 灌入演示种子（幂等），再回来创建批次。</div>`;
        return;
      }
      // 默认选第一条 published
      let defaultIdx = 0;
      for (let i = 0; i < items.length; i++) {
        if (items[i].status === "published") { defaultIdx = i; break; }
      }
      sel.innerHTML = items.map((it, i) => {
        // 去重：name 往往本身就写着「型号 / v版本」（如 "P-TEST / JH-550W / v2 · JH-550W"），
        // 若再无条件拼 model + 版本号会出现「JH-550W / v2 · ... · JH-550W」式重复。
        // 改法：逐段判断——某段（project_id / model / "v"+version_no）已包含在 name 里就不再拼，
        // 没包含才补上，信息量不丢、重复只显示一次。project_id 通常独立于 name，一般仍会保留。
        const segs = [it.project_id, it.model, "v" + it.version_no].filter((seg) => seg && it.name.indexOf(seg) < 0);
        const label = (segs.length ? segs.join(" / ") + " · " : "") + it.name + " [" + statusZh(it.status) + "]";
        return `<option value="${escapeHtml(it.rule_version_id)}" ${i === defaultIdx ? "selected" : ""}>${escapeHtml(label)}</option>`;
      }).join("");
      hint.innerHTML = `<div class="note ok">共 ${items.length} 个规则版本可选。</div>`;
    }

    /* ---- 批次列表：GET /api/batches ---- */
    async function loadBatchList() {
      const box = ZHL.mount(document.getElementById("batchList"), "加载中…");
      const r = await ZHL.request("GET", "/api/batches", undefined, box);
      if (!r.ok) {
        // 列表加载失败不阻断页面，只提示
        box.set(`<div class="state-error"><strong>批次列表加载失败（HTTP ${r.res ? r.res.status : "网络错误"}）</strong>
          <div class="note err" style="margin-top:8px;margin-bottom:0">后端可能未启动或接口不存在。可改用下方「按批次 ID 进入」。</div></div>`);
        return;
      }
      const rows = r.data || [];
      if (rows.length === 0) {
        box.set(`<div class="note">暂无批次。可从上方「创建新批次」开始。</div>`);
        return;
      }
      box.set(
        `<table class="tbl"><thead><tr>
            <th>批次编号</th><th>项目</th><th>型号</th><th>状态</th><th>计划量</th><th>创建时间</th><th>操作</th>
          </tr></thead><tbody>` +
        rows.map((b) => `<tr>
            <td class="mono">${escapeHtml(b.batch_no)}</td>
            <td class="mono">${escapeHtml(b.project_id)}</td>
            <td>${escapeHtml(b.model)}</td>
            <td>${statusBadge(b.status)}</td>
            <td>${b.planned_quantity}</td>
            <td class="mono" style="font-size:12px;white-space:nowrap">${fmtDateTimeCell(b.created_at)}</td>
            <td class="row-actions">
              <button class="btn ghost" data-go="batch" data-id="${escapeHtml(b.batch_id)}">进入</button>
              <button class="btn ghost" data-go="trace" data-id="${escapeHtml(b.batch_id)}">轨迹</button>
              <button class="btn ghost" data-go="intake" data-id="${escapeHtml(b.batch_id)}">入场</button>
            </td>
          </tr>`).join("") +
        `</tbody></table>`
      );
    }

    /* 行内跳转按钮（事件委托） */
    document.getElementById("batchList").addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-go]");
      if (!btn) return;
      const id = btn.dataset.id;
      ZHL.remember("batch", id); // 记住上下文，后续页自动带入
      const map = { batch: "batch.html", trace: "trace.html", intake: "intake.html" };
      location.href = map[btn.dataset.go] + "?batchId=" + encodeURIComponent(id);
    });

    /* ---- 创建批次 ---- */
    const createGuard = ZHL.guardSubmit(document.getElementById("createBatch"), "创建中…");
    document.getElementById("createBatch").addEventListener("click", () => {
      createGuard.run(async () => {
        const box = ZHL.mount(document.getElementById("createResult"), "创建中…");
        const body = {
          batch_no: document.getElementById("fBatchNo").value.trim(),
          project_id: document.getElementById("fProject").value.trim(),
          model: document.getElementById("fModel").value.trim(),
          rule_version_id: document.getElementById("fRule").value,
          planned_quantity: Number(document.getElementById("fQty").value),
        };
        if (!body.batch_no || !body.project_id || !body.model || !body.rule_version_id) {
          box.fail(0, "请填写完整：batchNo / projectId / model / 规则版本（下拉选择）。");
          return;
        }
        const r = await ZHL.request("POST", "/api/batches", body, box);
        if (r.ok) {
          const bid = r.data && r.data.batch_id;
          ZHL.remember("batch", bid); // 记住上下文，后续页自动带入
          box.set(
            `<div class="note ok">创建成功，批次 ID：<span class="mono">${escapeHtml(bid)}</span>，状态：${statusZh(r.data && r.data.status)}。</div>
             <div style="margin-top:10px">
               <button class="btn" onclick="location.href='batch.html?batchId='+encodeURIComponent('${bid}')">进入该批次</button>
               <button class="btn ghost" onclick="location.href='intake.html?batchId='+encodeURIComponent('${bid}')">前往数据入场</button>
               <button class="btn ghost" onclick="loadBatchList();refreshList()">刷新列表</button>
             </div>`
          );
          loadBatchList(); // 列表同步刷新
        }
      });
    });

    /* ---- 按 ID 进入 ---- */
    document.getElementById("goBatch").addEventListener("click", () => {
      const id = document.getElementById("batchId").value.trim();
      if (!id) { alert("请输入批次 ID，或从上方列表点击「进入」"); return; }
      ZHL.remember("batch", id);
      location.href = "batch.html?batchId=" + encodeURIComponent(id);
    });
    document.getElementById("goTraces").addEventListener("click", () => {
      const id = document.getElementById("batchId").value.trim();
      if (!id) { alert("请输入批次 ID，或从上方列表点击「轨迹」"); return; }
      ZHL.remember("batch", id);
      location.href = "trace.html?batchId=" + encodeURIComponent(id);
    });
    document.getElementById("refreshList").addEventListener("click", loadBatchList);
    function refreshList() { loadBatchList(); }

    /* 启动：并行加载规则下拉与批次列表 */
    loadRuleVersions();
    loadBatchList();
  </script>
</body>
</html>
