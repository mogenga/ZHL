<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>异常列表 · 质慧链</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%E8%B4%A8%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="page">
    <h1>全局异常列表</h1>
    <p class="subtitle">跨批次的全部异常事件。点击行进入异常详情（指派 / CAPA / 复检）。</p>

    <div class="card">
      <!-- 技术信息（维护者参考，不渲染到界面）：GET /api/incidents -->
      <h3>异常列表</h3>
      <button class="btn" id="loadAll">加载</button>
      <span class="muted" id="hint">异常由批次判定时创建；列表为空表示暂无异常。</span>
    </div>

    <div id="listResult"></div>
  </div>

  <script src="common.js"></script>
  <script>
    renderTopbar("incidents.html");

    document.getElementById("loadAll").addEventListener("click", loadList);
    loadList();

    async function loadList() {
      const box = ZHL.mount(document.getElementById("listResult"), "加载中…");
      const r = await ZHL.request("GET", "/api/incidents", undefined, box);
      if (!r.ok) return;
      const rows = r.data;
      if (!rows || !rows.length) {
        box.set(`<div class="note info">暂无异常事件。</div>`);
        return;
      }
      const items = rows.map((i) => `
        <div class="item-row">
          <div>
            <a href="incident.html?incidentId=${encodeURIComponent(i.incident_id)}&batchId=${encodeURIComponent(i.batch_id)}" data-inc="${escapeHtml(i.incident_id)}" data-bat="${escapeHtml(i.batch_id)}"><strong class="mono">${escapeHtml(i.incident_id)}</strong></a>
            <div class="meta">触发：${escapeHtml(i.trigger_type)} · 严重度：${escapeHtml(i.severity)} · 批次：${escapeHtml(i.batch_id)}</div>
          </div>
          <div style="display:flex; align-items:center; gap:10px">
            ${statusBadge(i.status, "incident")}
          </div>
        </div>`).join("");
      box.set(`<div class="card"><h3>共 ${rows.length} 条异常</h3><div class="item-list">${items}</div></div>`);
      // 行内跳转：记住上下文，异常详情/复检页可自动带入
      box.querySelectorAll('a[data-inc]').forEach((a) => {
        a.addEventListener("click", () => {
          ZHL.remember("incident", a.dataset.inc);
          if (a.dataset.bat) ZHL.remember("batch", a.dataset.bat);
        });
      });
    }
  </script>
</body>
</html>
