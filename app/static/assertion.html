<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZHL · 放行断言</title>
<style>
:root{--bg:#0e1420;--card:#161f2f;--ink:#dbe6f5;--dim:#8ba0c0;--ok:#3fbf6f;--warn:#e0a34a;--bad:#e05a5a;--line:#27364f;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Segoe UI",system-ui,sans-serif;padding:24px}
h1{font-size:20px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;color:var(--dim);margin:10px 0 4px;font-size:12px}
input{width:100%;background:#0b101a;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}
button{background:#2f6feb;color:#fff;border:0;border-radius:6px;padding:9px 16px;font:inherit;cursor:pointer}
button:disabled{opacity:.5}
.pill{padding:2px 10px;border-radius:10px;font-size:12px;background:#22304a}
.pill.ok{background:rgba(63,191,111,.18);color:var(--ok)}
.pill.bad{background:rgba(224,90,90,.18);color:var(--bad)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all}
.small{color:var(--dim);font-size:12px}
pre{background:#0b101a;border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;font-size:12px}
h2{font-size:15px;margin:14px 0 6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl .name{font-weight:600;white-space:nowrap}
.tbl .reason{color:var(--dim)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
</style>
</head>
<body>
<h1>ZHL · 放行断言 (assertion.html)</h1>

<div class="card">
  <label>批次 UUID (batch_id，须处于 pending_release)</label>
  <input id="batch" value="">
  <label>批准人 approved_by</label>
  <input id="by" value="ZHL-ENG">
  <div style="margin-top:12px">
    <button id="run">运行 7 项断言并放行</button>
  </div>
</div>

<div class="card">
  <h2>断言结果</h2>
  <div id="verdict" class="small">尚未运行。批次须为 <b>pending_release</b>；全 7 项通过才写 released，否则保留 pending_release 并命名缺口（PB D4）。</div>
  <table class="tbl" id="tbl" hidden>
    <thead><tr><th>状态</th><th>断言项</th><th>原因 / 缺口</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<div class="card">
  <h2>原始响应</h2>
  <pre id="raw" hidden></pre>
</div>

<script>
const $ = id => document.getElementById(id);
async function api(method, url, body){
  const opt = {method, headers:{"Content-Type":"application/json"}};
  if (body !== undefined) opt.body = JSON.stringify(body);
  const r = await fetch(url, opt);
  let data; try { data = await r.json(); } catch { data = {raw: await r.text().catch(()=>"")}; }
  return {status:r.status, data};
}
// item-7 label map so the reinspection-scope-coverage item renders in the
// same format as items 1–6.
const NAMES = {
  all_rules_resolved: "规则已解析",
  all_samples_passed: "全部抽样通过",
  all_incidents_closed: "无未决事故",
  no_isolated_sn: "无隔离 SN",
  required_evidence_present: "必备证据齐备",
  all_capa_verified: "CAPA 已验证",
  reinspection_scope_covered: "复检范围覆盖",   // item 7 (PB D7-7)
};
$("run").addEventListener("click", async () => {
  const batch = $("batch").value.trim();
  const res = await api("POST", `/api/batches/${batch}/release`, {approved_by: $("by").value});
  const d = res.data;
  $("raw").hidden = false; $("raw").textContent = JSON.stringify(res, null, 2);
  const verdict = $("verdict");
  if (res.status === 409){
    verdict.innerHTML = `批次不可放行 <span class="pill bad">409</span> <span class="small">${JSON.stringify(d.detail||d)}</span>`;
    $("tbl").hidden = true; return;
  }
  const passed = d.passed === true;
  verdict.innerHTML = passed
    ? `<span class="pill ok">全 7 项通过</span> 批次已 <b>released</b>`
    : `<span class="pill bad">存在缺口</span> 批次保留 <b>pending_release</b>（D4：断言失败不改状态），重试可修正后再次放行`;
  const tb = $("tbl").querySelector("tbody"); tb.innerHTML = ""; $("tbl").hidden = false;
  (d.checks||[]).forEach(c => {
    const tr = document.createElement("tr");
    const reason = c.passed ? (c.reason || "—") : c.reason || "缺口未命名";
    tr.innerHTML = `<td><span class="dot ${c.passed?"ok":"bad"}"></span></td>` +
      `<td class="name">${NAMES[c.name] || c.name}</td>` +
      `<td class="reason mono">${reason}</td>`;
    tb.appendChild(tr);
  });
});
</script>
</body>
</html>
