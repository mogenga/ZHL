<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZHL · 事故处置</title>
<style>
:root{--bg:#0e1420;--card:#161f2f;--ink:#dbe6f5;--dim:#8ba0c0;--ok:#3fbf6f;--warn:#e0a34a;--bad:#e05a5a;--line:#27364f;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Segoe UI",system-ui,sans-serif;padding:24px}
h1{font-size:20px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;color:var(--dim);margin:10px 0 4px;font-size:12px}
input,select,textarea{width:100%;background:#0b101a;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}
button{background:#2f6feb;color:#fff;border:0;border-radius:6px;padding:9px 16px;font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{padding:2px 10px;border-radius:10px;font-size:12px;background:#22304a}
.pill.ok{background:rgba(63,191,111,.18);color:var(--ok)}
.pill.bad{background:rgba(224,90,90,.18);color:var(--bad)}
.pill.warn{background:rgba(224,163,74,.18);color:var(--warn)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all}
.small{color:var(--dim);font-size:12px}
pre{background:#0b101a;border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;font-size:12px}
h2{font-size:15px;margin:14px 0 6px}
ul{margin:6px 0;padding-left:20px}
</style>
</head>
<body>
<h1>ZHL · 事故处置 (incident.html)</h1>

<div class="card">
  <label>批次 UUID (batch_id)</label>
  <input id="batch" placeholder="批次 UUID" value="">
  <div class="row" style="margin-top:12px">
    <button data-act="create">创建事故</button>
    <button data-act="assign">指派</button>
    <button data-act="capa">提交 CAPA</button>
    <button data-act="list">列出事故</button>
  </div>
  <div class="row" style="margin-top:10px">
    <input id="incident" placeholder="事故 UUID" style="max-width:320px">
    <button data-act="detail">查看</button>
  </div>
</div>

<div class="card">
  <h2>创建事故</h2>
  <div class="row">
    <select id="trigger" style="max-width:200px">
      <option>rule_fail</option><option>sample_fail</option>
      <option>appearance_manual</option><option>data_consistency</option>
      <option>rule_missing</option>
    </select>
    <select id="severity" style="max-width:140px">
      <option>critical</option><option selected>major</option><option>minor</option>
    </select>
  </div>
  <label>受影响 SN (逗号分隔)</label>
  <input id="sns" placeholder="SN-I-OODB">
  <label>证据 ID (逗号分隔，可选)</label>
  <input id="evids" placeholder="">
</div>

<div class="card">
  <h2>指派 / CAPA</h2>
  <label>责任人 owner</label><input id="owner" placeholder="ZHL-QA">
  <label>截止时间 due_at</label><input id="due" placeholder="2026-06-05T00:00:00+00:00">
  <label>遏制措施 containment (可选)</label><input id="contain" placeholder="">
  <label>已确认根因</label><input id="cause" placeholder="">
  <label>纠正措施</label><input id="action" placeholder="">
  <div class="row" style="margin-top:8px">
    <label style="margin:0">CAPA 已验证 (verified)</label>
    <input type="checkbox" id="verified" style="width:auto">
  </div>
</div>

<div class="card">
  <h2>结果</h2>
  <div id="out" class="mono small"></div>
  <pre id="raw" hidden></pre>
</div>

<script>
const $ = id => document.getElementById(id);
function out(html){ $("out").innerHTML = html; }
function dump(obj){ $("raw").hidden = false; $("raw").textContent = JSON.stringify(obj, null, 2); }
async function api(method, url, body){
  const opt = {method, headers:{"Content-Type":"application/json"}};
  if (body !== undefined) opt.body = JSON.stringify(body);
  const r = await fetch(url, opt);
  let data; try { data = await r.json(); } catch { data = {raw: await r.text().catch(()=>"")}; }
  return {status:r.status, data};
}
const csv = s => (s||"").split(",").map(x=>x.trim()).filter(Boolean);

document.querySelectorAll("button[data-act]").forEach(b => b.addEventListener("click", async () => {
  const act = b.dataset.act; const batch = $("batch").value.trim();
  let res;
  if (act === "create"){
    res = await api("POST", "/api/incidents", {
      batch_id: batch, trigger_type: $("trigger").value, severity: $("severity").value,
      affected_sns: csv($("sns").value), evidence_ids: csv($("evids").value)
    });
    if (res.status === 201) { $("incident").value = res.data.incident_id; out("已创建事故 <span class='pill ok'>201</span> " + res.data.incident_id); }
    else out("失败 <span class='pill bad'>" + res.status + "</span>");
  } else if (act === "assign"){
    const inc = $("incident").value.trim();
    res = await api("POST", `/api/incidents/${inc}/assign`, {owner: $("owner").value, due_at: $("due").value, containment_action: $("contain").value || null});
    if (res.status === 200) out("已指派 <span class='pill ok'>assigned</span> " + JSON.stringify(res.data.status)); else out("失败 <span class='pill bad'>" + res.status + "</span> " + (res.data.detail||""));
  } else if (act === "capa"){
    const inc = $("incident").value.trim();
    res = await api("POST", `/api/incidents/${inc}/capa`, {confirmed_root_cause: $("cause").value, corrective_action: $("action").value, verified: $("verified").checked});
    if (res.status === 200) out("CAPA 已提交 <span class='pill ok'>pending_recheck</span>"); else out("失败 <span class='pill bad'>" + res.status + "</span> " + JSON.stringify(res.data.detail||{}));
  } else if (act === "list"){
    res = await api("GET", `/api/incidents?batch_id=${encodeURIComponent(batch)}`);
    out("事故 <span class='pill'>" + (Array.isArray(res.data)?res.data.length:res.status) + "</span>"); dump(res.data);
  } else if (act === "detail"){
    const inc = $("incident").value.trim();
    res = await api("GET", `/api/incidents/${inc}`);
    if (res.status === 200){ const d = res.data; out(`事故 <span class='pill ${d.status==='new'?'warn':'ok'}'>${d.status}</span> ${d.incident_id}<br>`
      + `<span class='small'>trigger=${d.trigger_type} severity=${d.severity} owner=${d.owner||"-"}</span>`
      + (d.root_cause_hypotheses ? `<h2>根因假设 (归因)</h2><ul>${(Array.isArray(d.root_cause_hypotheses)?d.root_cause_hypotheses:Object.values(d.root_cause_hypotheses)).map(h=>`<li>rank=${h.rank} · <b>${h.cause}</b> · conf=${h.confidence} · ev=[${(h.evidence_ids||[]).join(",")}] · <i>${h.recommended_action}</i></li>`).join("")}</ul>` : "<span class='small'>尚无根因假设（先运行归因 Skill）</span>");
    } else out("失败 <span class='pill bad'>" + res.status + "</span>");
  }
  dump(res.data);
}));
</script>
</body>
</html>
