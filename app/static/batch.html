<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>批次详情 · 质慧链</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%E8%B4%A8%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="page">
    <h1>批次详情 / 判定（第 2 段）</h1>
    <p class="subtitle">查看批次状态、逐 SN 判定与证据、抽样结论、状态时间线；可触发判定、发起异常、进入放行。</p>

    <div class="card">
      <h3>选择批次</h3>
      <div class="form-grid">
        <div><label for="bBatch">批次 ID（UUID）</label><input type="text" id="bBatch"></div>
      </div>
      <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap">
        <button class="btn" id="loadBatch">加载批次（GET /api/batches/{id}）</button>
        <button class="btn ghost" id="judgeBatch" disabled>触发判定（POST .../judge）</button>
        <button class="btn ghost" id="openIncident" disabled>发起异常（POST /api/incidents）</button>
      </div>
      <div id="batchResult"></div>
    </div>

    <div id="detail"></div>
    <div id="judgeResult"></div>

    <div class="card" id="incidentForm" style="display:none">
      <h3>发起异常事件</h3>
      <p class="muted">异常只能发起在 <strong>已隔离（isolated）</strong> 的批次上；后端非 isolated 状态返回 409。</p>
      <div class="form-grid">
        <div><label for="incTrigger">触发类型 triggerType</label>
          <select id="incTrigger">
            <option value="rule_fail">rule_fail（规则判定失败）</option>
            <option value="sample_fail">sample_fail（抽样失败）</option>
            <option value="appearance">appearance（人工外观异常）</option>
            <option value="data_consistency">data_consistency（数据一致性 / SN 冲突）</option>
            <option value="rule_missing">rule_missing（型号无已发布规则）</option>
          </select>
        </div>
        <div><label for="incSev">严重度 severity</label>
          <select id="incSev">
            <option value="critical">critical（严重）</option>
            <option value="major">major（主要）</option>
            <option value="minor">minor（一般）</option>
          </select>
        </div>
        <div class="field-full"><label for="incSns">影响 SN（逗号分隔）</label><input type="text" id="incSns" placeholder="SN88213, SN88214"></div>
      </div>
      <div style="margin-top:12px">
        <button class="btn danger" id="doCreateIncident">创建异常</button>
      </div>
      <div id="incidentResult"></div>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    renderTopbar("batch.html");

    let currentBatch = null;

    /* 上下文记忆：URL 参数优先，其次 localStorage（从首页/列表跳转时已 remember） */
    const ctx = ZHL.prefill("batchId", "batch");
    const pre = ctx.value;
    if (pre) {
      document.getElementById("bBatch").value = pre;
      ZHL.remember("batch", pre);
      if (ctx.from === "local") {
        document.querySelector(".form-grid").insertAdjacentHTML(
          "afterend", `<div class="note info" style="margin:8px 0">批次 ID 已自动带入上次上下文（${escapeHtml(pre)}），可修改。点击「加载批次」查看详情。</div>`
        );
      }
    }

    document.getElementById("loadBatch").addEventListener("click", loadDetail);

    async function loadDetail() {
      const box = ZHL.mount(document.getElementById("batchResult"), "加载中…");
      const id = document.getElementById("bBatch").value.trim();
      if (!id) { box.fail(0, "请填写批次 ID。"); return; }
      const r = await ZHL.request("GET", `/api/batches/${encodeURIComponent(id)}`, undefined, box);
      if (!r.ok) return;
      const d = r.data;
      currentBatch = d;
      ZHL.remember("batch", d.batch_id); // 记住当前批次
      renderDetail(d, box);
      document.getElementById("judgeBatch").disabled = false;
      document.getElementById("openIncident").disabled = d.status !== "isolated";
      document.getElementById("incidentForm").style.display = d.status === "isolated" ? "block" : "none";
    }

    function renderDetail(d, box) {
      const failSns = (d.inspections || []).filter((i) => i.decision_status === "Fail" || i.decision_status === "fail");
      const rows = (d.inspections || []).map((i) => {
        const ev = i.decision_evidence;
        const evHtml = ev ? ZHL.evidenceBlock(ev) : `<span class="muted">（未判定）</span>`;
        return `<tr>
          <td class="mono">${escapeHtml(i.sn)}</td>
          <td>${escapeHtml(i.intake_status || "—")}</td>
          <td>${decisionBadge(i.decision_status)}</td>
          <td>${evHtml}</td>
        </tr>`;
      }).join("");
      const tl = (d.status_timeline || []).map((t) =>
        `<div class="t-item"><div class="t-time" style="white-space:nowrap">${fmtDateTimeCell(t.started_at)}</div>
         <div class="t-title">${escapeHtml(t.skill_name || "")} ${t.target ? "→ " + escapeHtml(t.target) : ""}</div></div>`
      ).join("");

      box.set(`
        <div class="note info">
          批次 <span class="mono">${escapeHtml(d.batch_no)}</span>（ID <span class="mono">${escapeHtml(d.batch_id)}</span>），
          状态：${statusBadge(d.status)}，计划数量 ${escapeHtml(d.planned_quantity)}，
          抽样结论：<strong>${escapeHtml(d.sample_result || "—")}</strong>
        </div>

        <div class="card">
          <h3>逐 SN 判定（含规则证据）</h3>
          ${failSns.length ? `<div class="note err" style="margin-bottom:10px">失败 SN（${failSns.length}）：${failSns.map((i) => escapeHtml(i.sn)).join("、")}。批次将 已隔离，请去「发起异常」。</div>` : ""}
          <table>
            <thead><tr><th>SN</th><th>入场状态</th><th>判定</th><th>判定证据（输入/阈值/公式/结果）</th></tr></thead>
            <tbody>${rows || `<tr><td colspan="4" class="muted">该批次暂无检验记录。</td></tr>`}</tbody>
          </table>
        </div>

        <div class="card">
          <h3>状态时间线</h3>
          <div class="timeline">${tl || `<div class="muted">暂无轨迹。</div>`}</div>
        </div>

        <div class="card">
          <h3>下一步</h3>
          <div class="item-list">
            <div class="item-row"><span>数据入场（送检数据）</span><a class="btn ghost" id="nextIntake" href="intake.html">打开</a></div>
            <div class="item-row"><span>触发判定 / 重判</span><button class="btn" id="againJudge">再次判定</button></div>
            <div class="item-row"><span>放行（需 待放行 状态）</span><a class="btn ghost" id="nextRelease" href="release.html">打开</a></div>
            <div class="item-row"><span>报告</span><a class="btn ghost" id="nextReport" href="report.html">打开</a></div>
            <div class="item-row"><span>任务轨迹</span><a class="btn ghost" id="nextTrace" href="trace.html">打开</a></div>
          </div>
        </div>
      `);
      document.getElementById("againJudge").addEventListener("click", doJudge);
      const bid = encodeURIComponent(d.batch_id);
      document.getElementById("nextIntake").href = "intake.html?batchId=" + bid;
      document.getElementById("nextRelease").href = "release.html?batchId=" + bid;
      document.getElementById("nextReport").href = "report.html?batchId=" + bid;
      document.getElementById("nextTrace").href = "trace.html?batchId=" + bid;
    }

    document.getElementById("judgeBatch").addEventListener("click", doJudge);
    const judgeGuard = ZHL.guardSubmit(document.getElementById("judgeBatch"), "判定中…");
    async function doJudge() {
      judgeGuard.run(async () => {
        const box = ZHL.mount(document.getElementById("judgeResult"), "判定中…");
        const id = document.getElementById("bBatch").value.trim();
        if (!id) { box.fail(0, "请填写批次 ID。"); return; }
        const r = await ZHL.request("POST", `/api/batches/${encodeURIComponent(id)}/judge`, {}, box);
        if (r.ok) {
          const d = r.data;
          const failList = (d.fail_sns && d.fail_sns.length)
            ? `<div class="note err">失败 SN（${d.fail_sns.length}）：${d.fail_sns.map(escapeHtml).join("、")}。批次将 已隔离，请去「发起异常」。</div>`
            : `<div class="note ok">全部通过，批次可进入 待放行。</div>`;
          box.set(
            `<div class="note ${d.result === "pass" ? "ok" : "warn"}">判定结果：<strong>${escapeHtml(d.result)}</strong>，
               计数 ${escapeHtml(JSON.stringify(d.counts || {}))}。</div>` +
            failList +
            `<details><summary>逐 SN 明细（per_sn）</summary>${ZHL.evidenceBlock(d.per_sn || [])}</details>` +
            `<div style="margin-top:10px">
              <button class="btn" id="reloadJudge">重新加载批次</button>
              ${d.result === "pass" ? `<a class="btn" href="release.html?batchId=${encodeURIComponent(id)}">判定通过 → 去放行</a>` : ""}
            </div>`
          );
          document.getElementById("reloadJudge").addEventListener("click", loadDetail);
        }
      });
    }

    document.getElementById("openIncident").addEventListener("click", () => {
      document.getElementById("incidentForm").style.display = "block";
      document.getElementById("incidentForm").scrollIntoView({ behavior: "smooth" });
    });

    const incGuard = ZHL.guardSubmit(document.getElementById("doCreateIncident"), "创建中…");
    document.getElementById("doCreateIncident").addEventListener("click", () => {
      incGuard.run(async () => {
        const box = ZHL.mount(document.getElementById("incidentResult"), "创建中…");
        const batch = currentBatch ? currentBatch.batch_id : document.getElementById("bBatch").value.trim();
        const sns = document.getElementById("incSns").value.split(",").map((s) => s.trim()).filter(Boolean);
        if (!batch) { box.fail(0, "请先加载批次。"); return; }
        if (!sns.length) { box.fail(0, "请填写影响 SN（异常必须关联 SN，不允许自由文本）。"); return; }
        const body = {
          batch_id: batch,
          trigger_type: document.getElementById("incTrigger").value,
          severity: document.getElementById("incSev").value,
          affected_sns: sns,
          evidence_ids: [],
        };
        const r = await ZHL.request("POST", "/api/incidents", body, box);
        if (r.ok) {
          ZHL.remember("incident", r.data.incident_id);
          ZHL.remember("batch", batch);
          box.set(
            `<div class="note ok">异常已创建，ID <span class="mono">${escapeHtml(r.data.incident_id)}</span>，
               状态 ${statusBadge(r.data.status, "incident")}。批次已隔离。</div>
             <a class="btn" href="incident.html?incidentId=${encodeURIComponent(r.data.incident_id)}&batchId=${encodeURIComponent(batch)}">去异常详情 / 指派 / CAPA</a>`
          );
        }
      });
    });

    // 初次加载
    if (pre) loadDetail();
  </script>
</body>
</html>
