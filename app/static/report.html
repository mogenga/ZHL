<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZHL · 报告归档</title>
<style>
:root{--bg:#0e1420;--card:#161f2f;--ink:#dbe6f5;--dim:#8ba0c0;--ok:#3fbf6f;--warn:#e0a34a;--bad:#e05a5a;--line:#27364f;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Segoe UI",system-ui,sans-serif;padding:24px}
h1{font-size:20px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;color:var(--dim);margin:10px 0 4px;font-size:12px}
input{width:100%;background:#0b101a;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}
button{background:#2f6feb;color:#fff;border:0;border-radius:6px;padding:9px 16px;font:inherit;cursor:pointer}
button:disabled{opacity:.5}
select{background:#0b101a;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}
.pill{padding:2px 10px;border-radius:10px;font-size:12px;background:#22304a}
.pill.ok{background:rgba(63,191,111,.18);color:var(--ok)}
.pill.bad{background:rgba(224,90,90,.18);color:var(--bad)}
.pill.warn{background:rgba(224,163,74,.18);color:var(--warn)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all}
.small{color:var(--dim);font-size:12px}
pre{background:#0b101a;border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;font-size:12px;max-height:520px}
h2{font-size:15px;margin:14px 0 6px}
ul{margin:6px 0;padding-left:20px}
</style>
</head>
<body>
<h1>ZHL · 报告归档 (report.html)</h1>

<div class="card">
  <label>批次 UUID (batch_id)</label>
  <input id="batch" value="">
  <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <label style="margin:0">报告类型</label>
    <select id="type">
      <option value="release">release (放行)</option>
      <option value="incident">incident (处置)</option>
    </select>
    <button id="gen">生成报告</button>
    <button id="list">列出报告</button>
  </div>
  <p class="small">D7：rejected 批次只允许 incident 类型；D8：archived 批次不可再出报告；
  D6a：released / rejected 出报告后同事务自动归档；D10：同批次同类型重渲染返回现有版本 (200)。</p>
</div>

<div class="card">
  <h2>当前报告</h2>
  <div id="verdict" class="small">尚未生成。</div>
  <pre id="md" hidden></pre>
</div>

<div class="card">
  <h2>报告列表 / 原始响应</h2>
  <pre id="raw" hidden></pre>
</div>

<script>
const $ = id => document.getElementById(id);
function dump(obj){ $("raw").hidden = false; $("raw").textContent = JSON.stringify(obj, null, 2); }
async function api(method, url, body){
  const opt = {method, headers:{"Content-Type":"application/json"}};
  if (body !== undefined) opt.body = JSON.stringify(body);
  const r = await fetch(url, opt);
  let data; try { data = await r.json(); } catch { data = {raw: await r.text().catch(()=>"")}; }
  return {status:r.status, data};
}
$("gen").addEventListener("click", async () => {
  const batch = $("batch").value.trim();
  const res = await api("POST", `/api/batches/${batch}/report`, {report_type: $("type").value});
  const d = res.data;
  if (res.status === 201 || res.status === 200){
    const tag = res.status === 201 ? "已生成 v" + d.version : "已存在 v" + d.version + "（D10 幂等）";
    $("verdict").innerHTML = `<span class="pill ${res.status===201?"ok":"warn"}">${tag}</span>
      类型=${d.report_type} · <span class="small">${d.generated_at}</span>`;
    $("md").hidden = false;
    $("md").textContent = d.content_md || JSON.stringify(d.content_json, null, 2);
  } else {
    $("verdict").innerHTML = `<span class="pill bad">失败 ${res.status}</span> <span class="small">${JSON.stringify(d.detail||d)}</span>`;
    $("md").hidden = true;
  }
  dump(res.data);
});
$("list").addEventListener("click", async () => {
  const batch = $("batch").value.trim();
  const res = await api("GET", `/api/batches/${batch}/reports`);
  const arr = Array.isArray(res.data) ? res.data : [];
  $("verdict").innerHTML = `<span class="pill">${arr.length}</span> 份报告 ·
    ${arr.map(r=>`${r.report_type} v${r.version}`).join("、") || "（无）"}`;
  dump(res.data);
});
</script>
</body>
</html>
