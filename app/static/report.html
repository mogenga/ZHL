<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>报告 · 质慧链</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%E8%B4%A8%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="page">
    <h1>报告归档（第 5 段）</h1>
    <p class="subtitle">只可读取已确认的结构化数据生成报告。已放行 → 放行报告；已拒绝 → 只能质量处置报告（incident 类型）。</p>

    <div class="card">
      <h3>生成 / 查看报告</h3>
      <div class="form-grid">
        <div><label for="rpBatch">批次 ID（UUID）</label><input type="text" id="rpBatch"></div>
        <div>
          <label for="rpType">报告类型 reportType</label>
          <select id="rpType">
            <option value="release">release（放行报告）</option>
            <option value="incident">incident（质量处置报告）</option>
          </select>
        </div>
      </div>
      <!-- 技术信息（维护者参考，不渲染到界面）：
           生成报告 = POST /api/batches/{batch_id}/report
           加载报告列表 = GET /api/batches/{batch_id}/reports
           查看指定报告 = GET /api/batches/{batch_id}/reports/{report_id} -->
      <div style="margin-top:12px; display:flex; gap:10px">
        <button class="btn" id="doGenerate">生成报告</button>
        <button class="btn ghost" id="doList">加载报告列表</button>
      </div>
      <div id="generateResult"></div>
      <div id="listResult"></div>
    </div>

    <div class="card">
      <h3>查看指定报告</h3>
      <div class="form-grid">
        <div><label for="rpViewId">报告 ID（UUID）</label><input type="text" id="rpViewId"></div>
      </div>
      <div style="margin-top:10px"><button class="btn ghost" id="doView">查看报告</button></div>
      <div id="viewResult"></div>
    </div>

    <div class="note todo">
      <strong>TODO：</strong>「报告自然语言摘要与追问」（FR-5.6，P1）后端未实现。
      报告变更时生成新版本（不覆盖）由后端 D10 幂等机制保证：重复调用返回已有版本（200），不升版本号。
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    renderTopbar("report.html");

    /* 上下文记忆：URL 参数优先，其次 localStorage（从放行页跳转时已 remember） */
    const pre = ZHL.prefill("batchId", "batch");
    if (pre.value) {
      document.getElementById("rpBatch").value = pre.value;
      if (pre.from === "local") {
        // UUID 不在正文全量显示（对质检员无意义），只示前 8 位 + …，完整值放 title 悬浮。
        document.querySelector(".form-grid").insertAdjacentHTML(
          "afterend", `<div class="note info" style="margin:8px 0" title="批次 ID 已自动带入上次上下文：${escapeHtml(pre.value)}">批次 ID 已自动带入上次上下文（${escapeHtml(String(pre.value).slice(0, 8))}…，<span class="muted">鼠标悬浮查看完整 ID</span>），可修改。</div>`
        );
      }
    }

    /* 提交按钮防重提交 */
    const genGuard = ZHL.guardSubmit(document.getElementById("doGenerate"), "生成中…");
    document.getElementById("doGenerate").addEventListener("click", () => {
      genGuard.run(async () => {
        const box = ZHL.mount(document.getElementById("generateResult"), "生成中…");
        const batchId = document.getElementById("rpBatch").value.trim();
        if (!batchId) { box.fail(0, "请填写批次 ID。", "无批次上下文：可回首页批次列表点击「进入」，或粘贴批次 UUID 后重试。"); return; }
        const reportType = document.getElementById("rpType").value;
        const r = await ZHL.request("POST", `/api/batches/${encodeURIComponent(batchId)}/report`, { report_type: reportType }, box);
        if (!r.ok) {
          // 409 rejected_batch_only_incident_report 等，box 已渲染，提示用户切换类型
          const d = r.data && r.data.detail;
          if (typeof d === "object" && d && d.error === "rejected_batch_only_incident_report") {
            box.set(
              `<div class="note err">已拒绝批次只能生成 <strong>incident（质量处置报告）</strong> 类型。请切换报告类型后重试。</div>`
            );
          }
          return;
        }
        const d = r.data;
        ZHL.remember("batch", batchId); // 记住上下文
        box.set(
          `<div class="note ok">报告已生成（类型 ${escapeHtml(d.report_type)}，版本 v${escapeHtml(d.version)}），
             生成时间 ${fmtDateTimeCell(d.generated_at)}。${r.res.status === 200 ? "（幂等命中已有版本）" : "（新版本 v" + escapeHtml(d.version) + "）"}</div>
           <div class="item-list" style="margin-top:8px">
             <div class="item-row"><span>查看报告内容</span><a class="btn" href="javascript:void(0)" id="jumpView">打开</a></div>
             <div class="item-row"><span>生成后 → 回批次轨迹</span><a class="btn ghost" href="trace.html?batchId=${encodeURIComponent(batchId)}">看轨迹</a></div>
             <div class="item-row"><span>生成后 → 回批次列表</span><a class="btn ghost" href="index.html">回工作台</a></div>
           </div>`
        );
        document.getElementById("rpViewId").value = d.report_id;
        document.getElementById("jumpView").addEventListener("click", viewReport);
        // 顺带刷新列表
        doList();
      });
    });

    document.getElementById("doList").addEventListener("click", doList);
    async function doList() {
      const box = ZHL.mount(document.getElementById("listResult"), "加载中…");
      const batchId = document.getElementById("rpBatch").value.trim();
      if (!batchId) { box.fail(0, "请填写批次 ID。"); return; }
      const r = await ZHL.request("GET", `/api/batches/${encodeURIComponent(batchId)}/reports`, undefined, box);
      if (!r.ok) return;
      const rows = r.data;
      if (!rows.length) { box.set(`<div class="note info">该批次暂无报告。</div>`); return; }
      const items = rows.map((x) => `
        <div class="item-row">
          <div>
            <strong>${escapeHtml(x.report_type)}</strong> · v${escapeHtml(x.version)} · 生成 ${fmtDateTimeCell(x.generated_at)}
            <div class="meta">${escapeHtml(x.report_id)}</div>
          </div>
          <button class="btn ghost" data-id="${escapeHtml(x.report_id)}">查看</button>
        </div>`).join("");
      box.set(`<div class="item-list">${items}</div>`);
      document.querySelectorAll("[data-id]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.getElementById("rpViewId").value = btn.getAttribute("data-id");
          viewReport();
        });
      });
    }

    document.getElementById("doView").addEventListener("click", viewReport);
    async function viewReport() {
      const box = ZHL.mount(document.getElementById("viewResult"), "加载中…");
      const batchId = document.getElementById("rpBatch").value.trim();
      const reportId = document.getElementById("rpViewId").value.trim();
      if (!batchId || !reportId) { box.fail(0, "请填写批次 ID 与报告 ID。"); return; }
      const r = await ZHL.request("GET", `/api/batches/${encodeURIComponent(batchId)}/reports/${encodeURIComponent(reportId)}`, undefined, box);
      if (!r.ok) return;
      const d = r.data;
      const md = d.content_md ? `<details open><summary>Markdown 报告（content_md）</summary><pre>${escapeHtml(d.content_md)}</pre></details>` : "";
      const js = `<details><summary>结构化数据（content_json）</summary>${ZHL.evidenceBlock(d.content_json)}</details>`;
      const agentPart = d.agent_task_id ? ` · Agent 任务 <span class="mono">${escapeHtml(d.agent_task_id)}</span>` : "";
      box.set(
        `<div class="note info">报告 <span class="mono">${escapeHtml(d.report_id)}</span> · ${escapeHtml(d.report_type)} · v${escapeHtml(d.version)} ·
           源快照 <span class="mono">${escapeHtml(d.source_snapshot_id)}</span>${agentPart}</div>
         ${md} ${js}`
      );
    }
  </script>
</body>
</html>
